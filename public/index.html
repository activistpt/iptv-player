<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#141420;--border:#2a2a3a;--accent:#6c5ce7;--accent2:#a29bfe;--text:#e0e0e0;--muted:#666;--fav:#f39c12}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--surface);padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:16px;color:var(--accent2)}
.header .spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.btn:hover{background:var(--accent2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-fav{background:transparent;border:1px solid var(--fav);color:var(--fav);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px}
.btn-fav.active{background:var(--fav);color:#000}
.search-wrap{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:320px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-tab{flex:1;padding:8px;text-align:center;font-size:11px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:.2s}
.sidebar-tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.sidebar-content{flex:1;overflow-y:auto}
.channels{flex:1;overflow-y:auto}
.channel-item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s}
.channel-item:hover{background:rgba(108,92,231,.15)}
.channel-item.active{background:rgba(108,92,231,.25);border-left:3px solid var(--accent)}
.channel-logo{width:36px;height:36px;border-radius:6px;object-fit:contain;background:#000;flex-shrink:0}
.channel-info{flex:1;min-width:0}
.channel-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-group{font-size:11px;color:var(--muted);margin-top:2px}
.channel-fav{margin-left:auto;flex-shrink:0;font-size:16px;cursor:pointer;opacity:.3;transition:.2s}
.channel-fav:hover,.channel-fav.active{opacity:1;color:var(--fav)}
.player-area{flex:1;display:flex;flex-direction:column;background:#000;position:relative}
#video{width:100%;height:100%;background:#000}
.player-controls{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;align-items:center;gap:10px;opacity:0;transition:.3s}
.player-area:hover .player-controls{opacity:1}
.player-controls .now-playing{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-controls button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:14px;flex-direction:column;gap:8px;padding:20px;text-align:center}
.empty .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.groups{padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;flex-shrink:0}
.group-tag{padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--muted);white-space:nowrap;transition:.15s}
.group-tag:hover,.group-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px;color:var(--accent2)}
.modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:10px}
.modal input,.modal textarea{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;resize:vertical}
.modal textarea{min-height:60px;font-family:monospace}
.modal input:focus,.modal textarea:focus{border-color:var(--accent)}
.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Playlist list */
.pl-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.pl-item:hover{background:rgba(108,92,231,.15)}
.pl-item.active{background:rgba(108,92,231,.25);border-left:3px solid var(--accent)}
.pl-icon{font-size:20px}
.pl-info{flex:1;min-width:0}
.pl-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-url{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-del{background:transparent;border:none;color:#e74c3c;cursor:pointer;font-size:14px;padding:4px;opacity:.5}
.pl-del:hover{opacity:1}
/* EPG */
.epg-list{padding:0}
.epg-item{padding:10px 12px;border-bottom:1px solid var(--border)}
.epg-time{font-size:11px;color:var(--accent2);font-weight:600;margin-bottom:2px}
.epg-title{font-size:13px;font-weight:500}
.epg-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.epg-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:768px){.sidebar{width:260px}}
@media(max-width:600px){.main{flex-direction:column}.sidebar{width:100%;height:40%;border-right:none;border-bottom:1px solid var(--border)}.player-area{height:60%}}
</style>
</head>
<body>
<div class="header">
  <h1>🎬 IPTV Player</h1>
  <div class="spacer"></div>
  <button class="btn btn-ghost" onclick="openConfig()">⚙️ Playlists</button>
  <button class="btn" onclick="loadCurrentPlaylist()">📡 Carregar</button>
</div>
<div class="search-wrap"><input type="text" id="search" placeholder="🔍 Pesquisar canal..." oninput="filterChannels()"></div>
<div class="groups" id="groups"><div class="group-tag active" onclick="filterGroup('all',this)">Todos</div></div>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" onclick="switchSidebar('channels',this)">📺 Canais</div>
      <div class="sidebar-tab" onclick="switchSidebar('favorites',this)">⭐ Favoritos</div>
      <div class="sidebar-tab" onclick="switchSidebar('epg',this)">📋 EPG</div>
    </div>
    <div class="sidebar-content" id="sidebarContent">
      <div class="channels" id="channels">
        <div class="empty"><div class="spinner"></div><span>Carregando canais...</span></div>
      </div>
    </div>
  </div>
  <div class="player-area" id="playerArea">
    <video id="video" controls playsinline webkit-playsinline></video>
    <div class="player-controls">
      <span class="now-playing" id="nowPlaying">Nenhum canal selecionado</span>
      <button onclick="toggleFavCurrent()" id="favBtn" class="btn-fav">☆ Favorito</button>
      <button onclick="toggleFullscreen()">⛶ Ecrã inteiro</button>
    </div>
  </div>
</div>

<!-- Config Modal -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <h2>⚙️ Gerir Playlists</h2>
    <div id="playlistList"></div>
    <hr style="border-color:var(--border);margin:16px 0">
    <h3 style="font-size:14px;color:var(--accent2);margin-bottom:12px">Adicionar Nova Playlist</h3>
    <div class="tabs">
      <div class="tab active" onclick="switchConfigTab('xtream',this)">Xtream Codes</div>
      <div class="tab" onclick="switchConfigTab('m3u',this)">M3U Direto</div>
    </div>
    <div id="xtreamTab">
      <label>Host (ex: http://servidor:8080)</label>
      <input type="text" id="xtreamHost" placeholder="http://servidor:8080">
      <label>Username</label>
      <input type="text" id="xtreamUser" placeholder="username">
      <label>Password</label>
      <input type="password" id="xtreamPass" placeholder="password">
    </div>
    <div id="m3uTab" style="display:none">
      <label>URL da lista M3U</label>
      <textarea id="m3uUrl" placeholder="http://servidor/playlist.m3u"></textarea>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeConfig()">Fechar</button>
      <button class="btn" onclick="addPlaylist()">➕ Adicionar</button>
    </div>
  </div>
</div>

<script>
const video=document.getElementById('video');
const channelsEl=document.getElementById('channels');
const groupsEl=document.getElementById('groups');
const searchEl=document.getElementById('search');
const nowPlaying=document.getElementById('nowPlaying');
const favBtn=document.getElementById('favBtn');
const sidebarContent=document.getElementById('sidebarContent');

let allChannels=[];
let currentGroup='all';
let currentChannel=null;
let activeSidebar='channels';

// === STORAGE ===
function getPlaylists(){
  try{return JSON.parse(localStorage.getItem('iptv_playlists')||'[]');}catch(e){return[];}
}
function savePlaylists(pl){localStorage.getItem('iptv_playlists',JSON.stringify(pl));}
function getFavorites(){
  try{return JSON.parse(localStorage.getItem('iptv_favorites')||'[]');}catch(e){return[];}
}
function saveFavs(favs){localStorage.setItem('iptv_favorites',JSON.stringify(favs));}
function getActivePlaylist(){return localStorage.getItem('iptv_active_pl')||'';}
function setActivePlaylist(id){localStorage.setItem('iptv_active_pl',id);}

// === SIDEBAR ===
function switchSidebar(tab,el){
  activeSidebar=tab;
  document.querySelectorAll('.sidebar-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(tab==='channels') renderChannels(allChannels);
  else if(tab==='favorites') renderFavorites();
  else if(tab==='epg') renderEPG();
}

// === PLAYLISTS ===
function renderPlaylistList(){
  const list=document.getElementById('playlistList');
  const playlists=getPlaylists();
  const active=getActivePlaylist();
  if(!playlists.length){list.innerHTML='<div class="empty" style="padding:12px;font-size:12px">Nenhuma playlist adicionada</div>';return}
  list.innerHTML=playlists.map(pl=>{
    const isActive=pl.id===active;
    const icon=pl.type==='xtream'?'🔑':'📋';
    return `<div class="pl-item ${isActive?'active':''}" onclick="selectPlaylist('${pl.id}')">
      <span class="pl-icon">${icon}</span>
      <div class="pl-info">
        <div class="pl-name">${pl.name||pl.host||pl.url}</div>
        <div class="pl-url">${pl.type==='xtream'?pl.host:pl.url}</div>
      </div>
      <button class="pl-del" onclick="event.stopPropagation();deletePlaylist('${pl.id}')">✕</button>
    </div>`;
  }).join('');
}

function selectPlaylist(id){
  setActivePlaylist(id);
  closeConfig();
  loadCurrentPlaylist();
}

function deletePlaylist(id){
  let pls=getPlaylists();
  pls=pls.filter(p=>p.id!==id);
  savePlaylists(pls);
  if(getActivePlaylist()===id){
    setActivePlaylist('');
    allChannels=[];
    renderChannels([]);
  }
  renderPlaylistList();
}

function addPlaylist(){
  const activeTab=document.querySelector('#configModal .tab.active');
  const isXtream=activeTab.textContent.includes('Xtream');
  const pls=getPlaylists();

  if(isXtream){
    const host=document.getElementById('xtreamHost').value.trim();
    const user=document.getElementById('xtreamUser').value.trim();
    const pass=document.getElementById('xtreamPass').value.trim();
    if(!host||!user||!pass){alert('Preenche todos os campos');return}
    pls.push({id:'pl_'+Date.now(),type:'xtream',name:host,host,username:user,password:pass});
  }else{
    const url=document.getElementById('m3uUrl').value.trim();
    if(!url){alert('Introduz um URL');return}
    // Detectar Xtream
    const xtreamMatch=url.match(/^(https?:\/\/[^/]+).*?[?&]username=([^&]+)&password=([^&]+)/i);
    if(xtreamMatch){
      pls.push({id:'pl_'+Date.now(),type:'xtream',name:xtreamMatch[1],host:xtreamMatch[1],username:decodeURIComponent(xtreamMatch[2]),password:decodeURIComponent(xtreamMatch[3])});
    }else{
      pls.push({id:'pl_'+Date.now(),type:'m3u',name:url,url});
    }
  }

  savePlaylists(pls);
  setActivePlaylist(pls[pls.length-1].id);
  document.getElementById('xtreamHost').value='';
  document.getElementById('xtreamUser').value='';
  document.getElementById('xtreamPass').value='';
  document.getElementById('m3uUrl').value='';
  renderPlaylistList();
  closeConfig();
  loadCurrentPlaylist();
}

function loadCurrentPlaylist(){
  const id=getActivePlaylist();
  if(!id){openConfig();return}
  const pl=getPlaylists().find(p=>p.id===id);
  if(!pl){openConfig();return}
  if(pl.type==='xtream') loadXtream(pl.host,pl.username,pl.password);
  else loadM3U(pl.url);
}

// === LOADERS ===
async function loadXtream(host,user,pass){
  showLoading();
  allChannels=[];
  currentGroup='all';
  try{
    const catResp=await fetch('/api/xtream/categories?host='+encodeURIComponent(host)+'&username='+user+'&password='+pass);
    if(!catResp.ok) throw new Error('HTTP '+catResp.status);
    const categories=await catResp.json();
    const chResp=await fetch('/api/xtream/channels?host='+encodeURIComponent(host)+'&username='+user+'&password='+pass);
    if(!chResp.ok) throw new Error('HTTP '+chResp.status);
    const channels=await chResp.json();
    const catMap={};
    categories.forEach(c=>{catMap[c.category_id]=c.category_name;});
    allChannels=channels.map(ch=>({
      name:ch.name,
      logo:ch.stream_icon||'',
      group:catMap[ch.category_id]||'Geral',
      url:host+'/live/'+user+'/'+pass+'/'+ch.stream_id+'.m3u8',
      streamId:ch.stream_id,
      epgChannelId:ch.epg_channel_id||''
    }));
    if(!allChannels.length){showError('Nenhum canal encontrado');return}
    buildGroups();
    if(activeSidebar==='channels') renderChannels(allChannels);
    if(allChannels[0]) playChannel(allChannels[0]);
  }catch(err){showError(err.message);}
}

async function loadM3U(url){
  showLoading();
  allChannels=[];
  currentGroup='all';
  try{
    const proxyUrl='/api/m3u?url='+encodeURIComponent(url);
    const resp=await fetch(proxyUrl);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const text=await resp.text();
    parseM3U(text);
  }catch(err){showError(err.message);}
}

function parseM3U(text){
  const lines=text.split('\n');
  let cur={};
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(line.startsWith('#EXTINF:')){
      const lm=line.match(/tvg-logo="([^"]*)"/);
      const logo=lm?lm[1]:'';
      const nm=line.match(/,(.+)$/);
      const name=nm?nm[1].trim():line;
      const gm=line.match(/group-title="([^"]*)"/);
      const group=gm?gm[1]:'Sem grupo';
      const em=line.match(/tvg-id="([^"]*)"/);
      const epgId=em?em[1]:'';
      cur={name,logo,group,epgId};
    }else if(line&&!line.startsWith('#')&&cur.name){
      cur.url=line;
      allChannels.push({...cur});
      cur={};
    }
  }
  if(!allChannels.length){showError('Nenhum canal encontrado');return}
  buildGroups();
  if(activeSidebar==='channels') renderChannels(allChannels);
  if(allChannels[0]) playChannel(allChannels[0]);
}

// === RENDER ===
function showLoading(){
  sidebarContent.innerHTML='<div class="channels" id="channels"><div class="empty"><div class="spinner"></div><span>A carregar canais...</span></div></div>';
}
function showError(msg){
  sidebarContent.innerHTML='<div class="channels" id="channels"><div class="empty"><span>❌ Erro: '+msg+'</span><br><button class="btn" style="margin-top:12px" onclick="openConfig()">Configurar</button></div></div>';
}

function buildGroups(){
  const groups=[...new Set(allChannels.map(c=>c.group))].sort();
  groupsEl.innerHTML='<div class="group-tag active" onclick="filterGroup(\'all\',this)">Todos</div>';
  groups.forEach(g=>{
    const t=document.createElement('div');
    t.className='group-tag';
    t.textContent=g;
    t.onclick=function(){filterGroup(g,this)};
    groupsEl.appendChild(t);
  });
}

function renderChannels(list){
  const favs=getFavorites();
  if(!list.length){sidebarContent.innerHTML='<div class="channels" id="channels"><div class="empty"><span>Nenhum canal encontrado</span></div></div>';return}
  sidebarContent.innerHTML='<div class="channels" id="channels">'+list.map(ch=>{
    const isFav=favs.includes(ch.url);
    return '<div class="channel-item" data-url="'+ch.url.replace(/'/g,"\\'")+'" onclick="playChannelByUrl(this.dataset.url)"><img class="channel-logo" src="'+(ch.logo||'')+'" onerror="this.style.display=\'none\'"><div class="channel-info"><div class="channel-name">'+ch.name+'</div><div class="channel-group">'+ch.group+'</div></div><span class="channel-fav '+(isFav?'active':'')+'" onclick="event.stopPropagation();toggleFav(\''+ch.url.replace(/'/g,"\\'")+'\',this)">'+(isFav?'★':'☆')+'</span></div>';
  }).join('')+'</div>';
}

function renderFavorites(){
  const favs=getFavorites();
  const favChannels=allChannels.filter(c=>favs.includes(c.url));
  if(!favChannels.length){
    sidebarContent.innerHTML='<div class="empty" style="padding:20px"><span>⭐ Nenhum favorito</span><br><span style="font-size:11px">Clica na estrela ☆ junto a um canal para adicionar</span></div>';
    return;
  }
  renderChannels(favChannels);
}

// === FAVORITES ===
function toggleFav(url,el){
  const favs=getFavorites();
  const idx=favs.indexOf(url);
  if(idx>=0){favs.splice(idx,1);el.textContent='☆';el.classList.remove('active');}
  else{favs.push(url);el.textContent='★';el.classList.add('active');}
  saveFavs(favs);
  updateFavBtn();
}

function toggleFavCurrent(){
  if(!currentChannel)return;
  toggleFav(currentChannel.url,null);
  // Update the star in sidebar
  document.querySelectorAll('.channel-fav').forEach(el=>{
    const item=el.closest('.channel-item');
    if(item&&item.dataset.url===currentChannel.url){
      const favs=getFavorites();
      const isFav=favs.includes(currentChannel.url);
      el.textContent=isFav?'★':'☆';
      el.classList.toggle('active',isFav);
    }
  });
}

function updateFavBtn(){
  if(!currentChannel){favBtn.textContent='☆ Favorito';favBtn.classList.remove('active');return}
  const favs=getFavorites();
  const isFav=favs.includes(currentChannel.url);
  favBtn.textContent=isFav?'★ Favorito':'☆ Favorito';
  favBtn.classList.toggle('active',isFav);
}

// === EPG ===
async function renderEPG(){
  const id=getActivePlaylist();
  if(!id){sidebarContent.innerHTML='<div class="epg-empty">Nenhuma playlist ativa</div>';return}
  const pl=getPlaylists().find(p=>p.id===id);
  if(!pl||pl.type!=='xtream'){sidebarContent.innerHTML='<div class="epg-empty">EPG apenas disponível para Xtream Codes</div>';return}

  sidebarContent.innerHTML='<div class="empty"><div class="spinner"></div><span>A carregar EPG...</span></div>';

  try{
    // Buscar EPG para os primeiros 20 canais
    const channelsWithEpg=allChannels.filter(c=>c.epgChannelId).slice(0,20);
    if(!channelsWithEpg.length){sidebarContent.innerHTML='<div class="epg-empty">Sem dados EPG disponíveis</div>';return}

    const epgData=[];
    for(const ch of channelsWithEpg){
      try{
        const url=pl.host+'/player_api.php?username='+pl.username+'&password='+pl.password+'&action=get_simple_data_table&stream_id='+ch.streamId;
        const resp=await fetch('/api/proxy?url='+encodeURIComponent(url));
        if(!resp.ok) continue;
        const data=await resp.json();
        if(data.epg_listings&&data.epg_listings.length){
          epgData.push({channel:ch.name,listings:data.epg_listings.slice(0,5)});
        }
      }catch(e){}
    }

    if(!epgData.length){sidebarContent.innerHTML='<div class="epg-empty">Sem dados EPG disponíveis</div>';return}

    let html='<div class="epg-list">';
    epgData.forEach(item=>{
      html+='<div style="padding:8px 12px;background:rgba(108,92,231,.1);font-size:12px;font-weight:600;color:var(--accent2);border-bottom:1px solid var(--border)">'+item.channel+'</div>';
      item.listings.forEach(ep=>{
        const start=ep.start?new Date(ep.start).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'';
        const end=ep.end?new Date(ep.end).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'';
        html+='<div class="epg-item"><div class="epg-time">'+start+' - '+end+'</div><div class="epg-title">'+ep.title+'</div>'+(ep.description?'<div class="epg-desc">'+ep.description+'</div>':'')+'</div>';
      });
    });
    html+='</div>';
    sidebarContent.innerHTML=html;
  }catch(err){
    sidebarContent.innerHTML='<div class="epg-empty">Erro ao carregar EPG: '+err.message+'</div>';
  }
}

// === PLAYER ===
function playChannel(ch){
  if(!ch||!ch.url)return;
  currentChannel=ch;
  nowPlaying.textContent=ch.name;
  video.src='/stream?url='+encodeURIComponent(ch.url);
  video.play().catch(()=>{});
  document.querySelectorAll('.channel-item').forEach(el=>el.classList.toggle('active',el.dataset.url===ch.url));
  updateFavBtn();
}

function playChannelByUrl(url){
  const ch=allChannels.find(c=>c.url===url);
  if(ch) playChannel(ch);
}

function filterChannels(){
  const q=searchEl.value.toLowerCase();
  const f=allChannels.filter(c=>c.name.toLowerCase().includes(q)&&(currentGroup==='all'||c.group===currentGroup));
  renderChannels(f);
}

function filterGroup(g,el){
  currentGroup=g;
  document.querySelectorAll('.group-tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  filterChannels();
}

function toggleFullscreen(){
  const a=document.getElementById('playerArea');
  if(document.fullscreenElement)document.exitFullscreen();else a.requestFullscreen();
}

// === CONFIG MODAL ===
function openConfig(){
  renderPlaylistList();
  document.getElementById('configModal').classList.add('show');
}
function closeConfig(){document.getElementById('configModal').classList.remove('show')}
function switchConfigTab(tab,el){
  document.querySelectorAll('#configModal .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('xtreamTab').style.display=tab==='xtream'?'block':'none';
  document.getElementById('m3uTab').style.display=tab==='m3u'?'block':'none';
}

// === INIT ===
loadCurrentPlaylist();
</script>
